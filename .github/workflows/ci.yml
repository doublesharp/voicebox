name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - doublesharp

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upstream integration regressions
        run: bun run test:upstream

      - name: Playback lifecycle regressions
        run: |
          bun run test:playback
          bun test app/tests/incremental-preview.test.ts app/tests/incremental-preview-hook.test.tsx
          bun test app/tests/tauri-audio-binary.test.ts
          bun test app/tests/composer-lifecycle.test.tsx

      - name: Voice, story and model regressions
        run: |
          for test in app/tests/profile-form-coverage.test.tsx app/tests/story-track-editor-coverage.test.tsx app/tests/model-management-coverage.test.tsx app/tests/*-priority*.test.tsx app/tests/studio-project-regressions.test.tsx app/tests/audio-dictation-regressions.test.tsx app/tests/key-codes-regressions.test.ts; do
            bun test "$test"
          done

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

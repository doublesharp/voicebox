name: DoubleSharp builds
run-name: DoubleSharp ${{ inputs.platforms }} build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package from the doublesharp branch
        type: choice
        required: true
        default: both
        options:
          - both
          - macos
          - windows

permissions:
  contents: read

concurrency:
  group: doublesharp-manual-build
  cancel-in-progress: true

jobs:
  build:
    # This workflow keeps the existing release.yml entry point so it can be
    # dispatched on doublesharp without changing the repository's default branch.
    # There are deliberately no push, pull_request, tag, or scheduled triggers.
    if: github.ref == 'refs/heads/doublesharp'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","python_arch":"x64","artifact":"windows-cuda"}]' || inputs.platforms == 'macos' && '[{"os":"macos-latest","target":"aarch64-apple-darwin","python_arch":"arm64","artifact":"macos-arm64"}]' || '[{"os":"macos-latest","target":"aarch64-apple-darwin","python_arch":"arm64","artifact":"macos-arm64"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","python_arch":"x64","artifact":"windows-cuda"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint backend inputs
        id: source
        run: |
          echo "backend=${{ hashFiles('backend/*.py', 'backend/backends/**', 'backend/services/**', 'backend/routes/**', 'backend/utils/**', 'backend/database/**', 'backend/vendor/**', 'backend/mcp_server/**', 'backend/requirements*.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Reuse unchanged CPU and MCP binaries
        id: server-cache
        uses: actions/cache@v4
        with:
          path: tauri/src-tauri/binaries
          key: fork-sidecars-v1-${{ matrix.target }}-py312-${{ steps.source.outputs.backend }}

      - name: Reuse unchanged CUDA backend
        if: runner.os == 'Windows'
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: backend/dist/voicebox-server-cuda
          key: fork-cuda-v1-cu128-${{ matrix.target }}-py312-${{ steps.source.outputs.backend }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          # Avoid restoring a multi-GB wheel cache when all binaries were reused.
          cache: ${{ (steps.server-cache.outputs.cache-hit != 'true' || (runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true')) && 'pip' || '' }}
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mlx.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          shared-key: fork-${{ matrix.target }}

      - name: Install backend dependencies when a binary needs rebuilding
        if: steps.server-cache.outputs.cache-hit != 'true' || (runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true')
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          python -m pip install --no-deps chatterbox-tts hume-tada omnivoice
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m pip install -r backend/requirements-mlx.txt
            python -m pip install --no-deps mlx-lm==0.31.1 mlx-audio==0.4.1
          fi

      - name: Build CPU and MCP binaries
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python backend/build_binary.py
          python backend/build_binary.py --shim
          mkdir -p tauri/src-tauri/binaries
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          for name in voicebox-server voicebox-mcp; do
            cp "backend/dist/${name}${suffix}" "tauri/src-tauri/binaries/${name}-${TARGET}${suffix}"
          done

      - name: Build CUDA backend
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX"
        run: |
          python -m pip install --force-reinstall --no-deps torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; assert torch.version.cuda, 'CUDA PyTorch is required'; print(torch.__version__, torch.version.cuda)"
          python backend/build_binary.py --cuda

      - name: Install frontend dependencies and check types
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Configure a custom build without upstream updates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = {
              "bundle": {"createUpdaterArtifacts": False},
              "plugins": {"updater": {"endpoints": []}},
          }
          if os.environ["RUNNER_OS"] == "macOS":
              config["bundle"]["macOS"] = {"signingIdentity": "-"}
          Path("tauri/fork-build.json").write_text(json.dumps(config))
          PY

      - name: Build desktop bundle
        working-directory: tauri
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bundle=app
          if [ "$RUNNER_OS" = "Windows" ]; then bundle=nsis; fi
          bun run tauri build --ci --target "$TARGET" --bundles "$bundle" --config fork-build.json

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "tauri/src-tauri/target/$TARGET/release/bundle/macos/Voicebox.app" release-assets/Voicebox-doublesharp-macos-arm64.zip

      - name: Package Windows installer and complete CUDA backend
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          cp tauri/src-tauri/target/"$TARGET"/release/bundle/nsis/*-setup.exe release-assets/
          python - <<'PY'
          import json
          from pathlib import Path
          Path("backend/dist/voicebox-server-cuda/cuda-libs.json").write_text(
              json.dumps({"version": "cu128-v1"}) + "\n"
          )
          PY
          # Use fast compression, and do not recompress this in upload-artifact.
          tar -c -C backend/dist voicebox-server-cuda | gzip -1 > release-assets/voicebox-cuda-windows-x64.tar.gz
          cp scripts/install-cuda-backend.ps1 release-assets/Install-CUDA.ps1

      - name: Record source revision and file checksums
        env:
          BUILD_SOURCE_SHA: ${{ github.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path("release-assets")
          manifest = {"commit": os.environ["BUILD_SOURCE_SHA"], "target": os.environ["BUILD_TARGET"], "files": {}}
          for path in sorted(folder.iterdir()):
              with path.open("rb") as stream:
                  manifest["files"][path.name] = hashlib.file_digest(stream, "sha256").hexdigest()
          (folder / "build-info.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Voicebox-doublesharp-${{ matrix.artifact }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
